[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-base-agent"
version = "0.1.0"
description = "RAG-based multi-region internal knowledge base agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cohere>=5.0.0",
    "chromadb>=0.4.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
